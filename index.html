<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#121317" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<!-- MUST stay "black", not "black-translucent". With black-translucent + -->
<!-- viewport-fit=cover, iOS draws the page under the status bar starting at -->
<!-- y=0 but still sizes the viewport ~62px SHORTER than the screen — so the -->
<!-- bottom ~62px is outside the page entirely and no CSS can paint it. That -->
<!-- was the persistent dead strip under the nav. "black" makes iOS lay the -->
<!-- web view out below the status bar and size it to the rest of the screen. -->
<!-- iOS only reads this when the app is ADDED to the Home Screen: changing -->
<!-- it does nothing until the icon is deleted and re-added. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black" />
<meta name="apple-mobile-web-app-title" content="DrumTune Pro" />
<title>DrumTune Pro</title>
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
<link rel="preload" href="assets/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="phone">
    <main id="view-root"></main>

    <!-- Tune · Kits · Analyze · More. Hidden on focus screens (tuning, setup) -->
    <!-- so the 72px readout has room; you leave those via the back chevron. -->
    <nav id="bottom-nav">
      <button class="nav-btn" data-route="home" aria-label="Tune">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 3v3"/><path d="M12 18v3"/><path d="M4.9 7.5A9 9 0 0 0 4.9 16.5"/><path d="M19.1 7.5a9 9 0 0 1 0 9"/></svg>
        <span>Tune</span>
      </button>
      <button class="nav-btn" data-route="kits" aria-label="Kits">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span>Kits</span>
      </button>
      <button class="nav-btn" data-route="advanced" aria-label="Analyze">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20v-11"/></svg>
        <span>Analyze</span>
      </button>
      <button class="nav-btn" data-route="more" aria-label="More">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>
        <span>More</span>
      </button>
    </nav>
  </div>

  <audio id="audio-unlock" src="assets/silence.wav" playsinline preload="auto" style="display:none"></audio>
  <script type="module" src="js/main.js"></script>
</body>
</html>
